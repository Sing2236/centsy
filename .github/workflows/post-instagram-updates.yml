name: Post Instagram Repo Updates

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  post-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Post summarized update to Instagram
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          INSTAGRAM_ALLOWED_BRANCHES: ${{ vars.INSTAGRAM_ALLOWED_BRANCHES }}
          INSTAGRAM_SKIP_TOKEN: ${{ vars.INSTAGRAM_SKIP_TOKEN }}
          INSTAGRAM_CONTAINER_WAIT_MS: ${{ vars.INSTAGRAM_CONTAINER_WAIT_MS }}
          INSTAGRAM_PUBLISH_RETRY_WAIT_MS: ${{ vars.INSTAGRAM_PUBLISH_RETRY_WAIT_MS }}
        run: node automation/instagram-updates/index.mjs
